name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (macOS .app universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build universal .app
        # `make app-universal` regenerates the icon, builds darwin/arm64 +
        # darwin/amd64 with cgo, lipos them into a fat binary, fans the icon
        # out to a multi-resolution iconset, and ad-hoc signs the bundle.
        # All the cross-compile env (CGO_ENABLED, CC=cc -arch ...) lives in
        # the Makefile so the CI step is just `make`.
        run: make app-universal VERSION="${{ steps.ver.outputs.version }}"

      - name: Inspect bundle
        run: |
          file dist/packxy.app/Contents/MacOS/packxy
          codesign -dv dist/packxy.app
          plutil -p dist/packxy.app/Contents/Info.plist | head -20

      - name: Package release archives
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p release
          # The .app archive — primary download for end users.
          tar -C dist -czf "release/packxy-${V}-darwin-universal.app.tar.gz" \
            packxy.app
          # Bare arch-specific binaries for users who don't want the bundle
          # (or want to integrate without /Applications). Include README +
          # config template so the tarball is self-contained.
          for arch in arm64 amd64; do
            stage="release/stage-${arch}"
            mkdir -p "${stage}"
            cp "dist/packxy-${arch}" "${stage}/packxy"
            cp README.md "${stage}/"
            cp internal/envcfg/packxy.conf.sample "${stage}/"
            tar -czf "release/packxy-${V}-darwin-${arch}.tar.gz" -C "${stage}" .
          done

      - name: Generate checksums
        working-directory: release
        run: |
          rm -rf stage-arm64 stage-amd64
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installation

            **Recommended — universal `.app` bundle (Apple Silicon + Intel):**

            ```bash
            curl -L -O https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.version }}/packxy-${{ steps.ver.outputs.version }}-darwin-universal.app.tar.gz
            tar -xzf packxy-*-darwin-universal.app.tar.gz
            ./packxy.app/Contents/MacOS/packxy install
            ```

            `packxy install` copies the bundle to `/Applications/packxy.app` and symlinks the CLI to `/usr/local/bin/packxy`. After that you can call `packxy` directly from the terminal.

            **Configure** `~/.config/packxy.conf` — `packxy install` drops a starter template there (see [`packxy.conf.sample`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/internal/envcfg/packxy.conf.sample)). Then connect:
            ```bash
            packxy start
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for the full guide.

            ## Verify download
            ```bash
            shasum -a 256 -c checksums.txt
            ```
