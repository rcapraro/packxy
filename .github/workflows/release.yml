name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (macOS .app, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Packxy.app
        # `make build` runs `swift build -c release`, then wraps the
        # executable into dist/Packxy.app (Info.plist with VERSION
        # interpolated + multi-resolution AppIcon.icns + ad-hoc
        # codesign). macos-latest is arm64, so the binary is arm64.
        run: make build VERSION="${{ steps.ver.outputs.version }}"

      - name: Inspect bundle
        run: |
          file dist/Packxy.app/Contents/MacOS/Packxy
          codesign -dv dist/Packxy.app
          plutil -p dist/Packxy.app/Contents/Info.plist | head -20

      - name: Package release archive
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p release
          tar -C dist -czf "release/Packxy-${V}-darwin-arm64.app.tar.gz" \
            Packxy.app

      - name: Generate checksums
        working-directory: release
        run: |
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installation

            **macOS 14+ on Apple Silicon.**

            ```bash
            curl -L -O https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.version }}/Packxy-${{ steps.ver.outputs.version }}-darwin-arm64.app.tar.gz
            tar -xzf Packxy-*-darwin-arm64.app.tar.gz
            mv Packxy.app /Applications/
            open /Applications/Packxy.app
            ```

            On first launch, click the Packxy menu-bar icon →
            **Settings… → Installation → Install…**. macOS prompts for
            your admin password to write `/etc/sudoers.d/packxy` and
            `/etc/ppp/peers/packxy`, then seeds `~/.config/packxy.conf`.
            Fill in **Connection** and **Split tunneling**, save, and
            click **Connect…** from the menu bar.

            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)
            for the full guide.

            ## Verify download
            ```bash
            shasum -a 256 -c checksums.txt
            ```
