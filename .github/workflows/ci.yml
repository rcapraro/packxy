name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/packxy-arm64 ./cmd/packxy

      - name: Build (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/packxy-amd64 ./cmd/packxy
